name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generated OpenAPI types
        run: npm run openapi:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:web

      - name: API tests
        run: npm test
        env:
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_management_test
          JWT_SECRET: ci-test-secret-with-at-least-32-characters
          REDIS_URL: redis://localhost:6379
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
          STRIPE_SUCCESS_URL: http://localhost:5173/payment-success
          STRIPE_CANCEL_URL: http://localhost:5173/payment-cancelled
          GYM_TIMEZONE: UTC

      - name: Production build
        run: npm run build
